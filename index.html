<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>COHAJ Sistema</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --papel:#F4F5F7; --tarjeta:#FFFFFF; --tinta:#16181D; --tinta2:#6B7080;
  --linea:#E3E5EA; --azul:#2F6FED; --azulsuave:#EAF0FD;
  --ok:#1E9E5A; --oksuave:#E9F7EF; --okborde:#BFE6CE;
  --rojo:#D6453D; --rojosuave:#FCEBEA; --rojoborde:#F1C4C1;
  --ambar:#B8760A; --ambarsuave:#FDF4E3; --ambarborde:#F0D9A8;
}
:root[data-theme="dark"]{
  --papel:#15171B; --tarjeta:#1E2126; --tinta:#EDEAE2; --tinta2:#A5A198;
  --linea:#31353C; --azul:#7FA8DC; --azulsuave:#22314A;
  --ok:#6FC48C; --oksuave:#1D3326; --rojo:#E58B84; --rojosuave:#42221F;
  --ambar:#D9B45C; --ambarsuave:#3A3120;
}
*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;margin:0;padding:0 0 86px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{padding:14px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header .hl{display:flex;flex-direction:column;gap:2px;flex:1;min-width:180px}
header .hb{display:flex;gap:6px;margin-left:auto}
header .hb .btn.chico{margin-top:0;padding:8px 12px;font-size:13px}
.segm{display:inline-flex;border:1.5px solid var(--azul);border-radius:99px;overflow:hidden;margin:6px 0 8px}
.segm button{border:none;background:transparent;color:var(--azul);font-family:inherit;font-weight:600;font-size:13px;padding:7px 14px;cursor:pointer}
.segm button.on{background:var(--azul);color:#fff}
.marca{font-family:'Archivo',sans-serif;font-weight:900;font-size:24px;letter-spacing:-.5px}
.marca span{color:var(--azul)}
.mini{font-size:12px;color:var(--tinta2)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--tarjeta);border-top:1px solid var(--linea);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;text-align:center;padding:10px 2px 12px;font-size:12.5px;font-weight:600;color:var(--tinta2);cursor:pointer;border:none;background:none;font-family:inherit}
.tab .ic{display:block;font-size:20px;margin-bottom:1px}
.tab.on{color:var(--azul)}
.tabs[hidden]{display:none}
.tabs .tl-l,.sb-top,.sb-foot{display:none}
.sb-nav{display:flex;flex:1}
/* ------- inicio (Hola, …) ------- */
.hola h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:28px;letter-spacing:-.5px;margin:10px 0 2px}
.sec{display:flex;align-items:center;gap:8px;font-family:'Archivo',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--tinta2);margin:26px 0 10px}
.sec .dot{width:8px;height:8px;border-radius:50%;background:var(--azul);flex:none}
.sec.ok{color:var(--ok)} .sec.ok .dot{background:var(--ok)}
.sec.rojo{color:var(--rojo)} .sec.rojo .dot{background:var(--rojo)}
.sec.amb{color:var(--ambar)} .sec.amb .dot{background:var(--ambar)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kpi{background:var(--tarjeta);border:1px solid var(--linea);border-left:4px solid var(--linea);border-radius:12px;padding:15px 18px 14px;min-height:92px}
.kpi.click{cursor:pointer;transition:box-shadow .15s} .kpi.click:hover{box-shadow:0 3px 10px rgba(20,30,60,.08)}
.kpi i{display:block;font-style:normal;font-size:13px;color:var(--tinta2)}
.kpi b{display:block;font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;line-height:1.1;margin:5px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi b small{font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:14px;color:var(--tinta2);letter-spacing:0}
.kpi.ok{border-color:var(--okborde);border-left-color:var(--ok);background:var(--oksuave)} .kpi.ok b{color:var(--ok)}
.kpi.rojo{border-color:var(--rojoborde);border-left-color:var(--rojo);background:var(--rojosuave)} .kpi.rojo b{color:var(--rojo)}
.kpi.amb{border-color:var(--ambarborde);border-left-color:var(--ambar);background:var(--ambarsuave)} .kpi.amb b{color:var(--ambar)}
.kpi.gris{border-left-style:dashed} .kpi.gris b{color:var(--tinta2);opacity:.75}
.kpi.punteado{border-style:dashed;border-left-style:solid}
.kpi .acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px} .kpi .acc .btn{margin-top:0}
.acwrap{position:relative}
.ac{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,60,.12);max-height:280px;overflow:auto;margin-top:4px}
.aci{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--linea);font-size:15px} .aci:last-child{border-bottom:none} .aci:hover{background:var(--azulsuave)}
@media (min-width:900px){
  body{padding:0}
  .wrap{max-width:none;margin:0;padding:26px 40px 60px 292px}
  .wrap>#app,.wrap>#cargando{max-width:1040px}
  header{display:none}
  .tabs{top:0;bottom:0;right:auto;width:252px;flex-direction:column;border-top:none;border-right:1px solid var(--linea);padding:22px 14px 18px;background:var(--papel)}
  .sb-top{display:block;padding:0 12px 16px;margin-bottom:10px;border-bottom:1px solid var(--linea)}
  .sb-top .marca{font-size:22px}
  .sb-nav{flex-direction:column;gap:2px}
  .tab{line-height:1.2}
  .tab .ic{flex:none}
  .tab{flex:none;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:9px;font-size:15px;font-weight:500;color:var(--tinta)}
  .tab .ic{display:inline-block;font-size:15px;margin:0;width:20px;text-align:center;color:var(--tinta2)}
  .tab.on{background:var(--tarjeta);color:var(--azul);font-weight:600;box-shadow:0 1px 2px rgba(20,30,60,.06)}
  .tab.on .ic{color:var(--azul)}
  .tabs .tl-c{display:none} .tabs .tl-l{display:inline}
  .sb-foot{display:block;border-top:1px solid var(--linea);padding-top:12px}
  .sb-foot .hb{flex-direction:column;margin:0;gap:2px}
  .sb-foot .btn.chico{margin:0;background:none;border:none;color:var(--tinta2);text-align:left;padding:8px 12px;font-weight:500;font-size:14px;border-radius:8px}
  .sb-foot .btn.chico:hover{color:var(--tinta);background:var(--tarjeta)}
  .toast{bottom:30px}
  .hola h1{font-size:32px}
}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin-bottom:10px}
h2{display:flex;align-items:center;gap:8px;font-family:'Archivo',sans-serif;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:var(--tinta2);margin:26px 0 10px}
h2::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--azul);flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:8px 0 4px}
.stat{background:var(--tarjeta);border:1px solid var(--linea);border-left:4px solid var(--azul);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat i{display:block;font-style:normal;font-size:13px;color:var(--tinta2);margin-top:3px}
.debe{color:var(--rojo)} .favor{color:var(--ok)} .aldia{color:var(--tinta2)}
input,select{width:100%;font-size:16px;font-family:inherit;padding:12px;border:1.5px solid var(--linea);border-radius:9px;background:var(--tarjeta);color:var(--tinta);outline:none;margin-top:4px}
input:focus,select:focus{border-color:var(--azul)}
label{font-size:13px;font-weight:600;color:var(--tinta2);display:block;margin-top:12px}
.btn{display:inline-block;background:var(--azul);color:#fff;border:none;border-radius:9px;font-family:inherit;font-weight:700;font-size:16px;padding:13px 22px;cursor:pointer;margin-top:14px}
.btn.sec{background:var(--tarjeta);color:var(--azul);border:1.5px solid var(--azul)}
.btn.chico{font-size:14px;padding:9px 14px;margin-top:8px}
.fila{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:box-shadow .15s}
.fila:hover{box-shadow:0 3px 10px rgba(20,30,60,.08)}
.card.cabecera{border-left:4px solid var(--azul)}
.gridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px} .gridcards .card{margin:0}
.lnk{color:var(--azul);cursor:pointer;text-decoration:none} .lnk:hover{text-decoration:underline}
.tab[hidden]{display:none!important}
.permgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px;margin-top:6px}
.chkl{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--tinta);margin:0;font-size:14px;text-transform:none}
.chkl input{width:auto;margin:0}
/* reparto */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.vcol{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.vhead{padding:12px 14px;border-bottom:1px solid var(--linea);background:var(--azulsuave)}
.vhead b{font-family:'Archivo',sans-serif;font-size:17px}
.vtot{margin-top:2px;color:var(--tinta)}
.vlist{padding:8px;min-height:60px}
.vlist.over{background:var(--azulsuave)}
.parada{border:1px solid var(--linea);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:var(--tarjeta)}
.parada.drg{opacity:.4}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.phead b{flex:1;font-size:15px}
.grip{cursor:grab;color:var(--tinta2);font-size:15px;user-select:none}
.pmove{display:flex;gap:2px}
.mini-btn{border:1px solid var(--linea);background:var(--tarjeta);color:var(--tinta2);border-radius:6px;font-size:13px;line-height:1;padding:4px 7px;cursor:pointer;font-family:inherit}
.mini-btn:hover{color:var(--azul);border-color:var(--azul)}
.pcli{display:grid;grid-template-columns:auto auto 1fr auto;align-items:baseline;gap:4px 10px;padding:5px 0 5px 4px;border-top:1px dashed var(--linea);font-size:14px}
.pcli .un{font-weight:600;font-variant-numeric:tabular-nums;min-width:34px}
.pcli .un:empty{min-width:0;margin-right:-10px}
.pcli .pe{font-weight:600;color:var(--azul);white-space:nowrap}
.pcli .pp{color:var(--ambar);font-size:12.5px}
.pcli .mini-btn{grid-column:4}
.pcli select.sel-v{grid-column:4}
.card>.pcli{grid-template-columns:1fr auto auto}
.card>.pcli select.sel-v{grid-column:3}
.tots{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 4px;font-size:14px}
.tots b{display:inline;font-family:'Archivo',sans-serif;font-size:18px;color:var(--tinta);margin:0}
.kpi.ancha{grid-column:span 2}
.vgrid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.vgrid.vacias{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.vgrid.vacias .vhead{padding:8px 12px}
.sel-v{margin-left:auto}
@media (max-width:899px){.grip{display:none} .tab{font-size:11px} .tabs .tab.tsec{display:none} .massheet{position:fixed;left:8px;right:8px;bottom:70px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;box-shadow:0 10px 30px rgba(20,30,60,.18);z-index:25;padding:6px} .massheet .tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:15px;padding:12px 14px;color:var(--tinta)} .massheet .tab .ic{display:inline;font-size:16px;margin:0;width:22px;text-align:center}}
@media (min-width:900px){.tab.mas,.massheet{display:none!important}}
@media (min-width:900px){.pmove{display:none}}
/* hoja de reparto impresa */
.hoja{page-break-after:always;break-after:page;font:10.5pt/1.3 'IBM Plex Sans',Arial,sans-serif;color:#000;padding:2mm 0}
.hoja:last-child{page-break-after:auto;break-after:auto}
.hoja .hh{display:flex;justify-content:space-between;gap:6mm;border-bottom:1.5px solid #000;padding-bottom:2mm;margin-bottom:2mm;font-size:11pt}
.hoja .hh b{font-size:13pt}
.hoja .ht{text-align:right;font-size:10pt}
.hoja .hp{break-inside:avoid;padding:1.2mm 0;border-bottom:1px solid #bbb}
.hoja .hpe{font-weight:700;font-size:11pt}
.hoja .hpc{display:grid;grid-template-columns:5mm 18mm 1fr 1fr;gap:2mm;padding:.4mm 0 .4mm 3mm}
.hoja .hpp{font-size:9pt;color:#333}
.filtros{align-items:center}
@media (max-width:899px){.kpis,.stats{grid-template-columns:repeat(2,1fr)} .kpi b,.stat b{font-size:20px} .kpi.ancha{grid-column:span 2}}
@media (min-width:900px){.card>label+input:not([type=search]),.card>label+select,.card>.grid2,.card>label+.acwrap,.card>.dias{max-width:600px}}
.fila.sel{border-color:var(--azul);background:var(--azulsuave)}
.chk{width:22px;height:22px;border:2px solid var(--azul);border-radius:6px;flex:none;position:relative}
.chk.on{background:var(--azul)}
.chk.on::after{content:'✓';color:#fff;position:absolute;left:4px;top:-1px;font-size:15px;font-weight:900}
.fila .dom{font-weight:600;font-size:16px}
.fila .nom{color:var(--tinta2);font-size:14px}
.fila .der{margin-left:auto;text-align:right;flex-shrink:0}
.monto{font-family:'Archivo',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;font-size:15.5px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px}
.p-susc{background:var(--azulsuave);color:var(--azul)}
.p-cli{background:var(--oksuave);color:var(--ok)}
.p-mix{background:var(--ambarsuave);color:var(--ambar)}
.p-inact{background:var(--linea);color:var(--tinta2)}
.p-warn{background:var(--ambarsuave);color:var(--ambar)}
.mov{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px solid var(--linea);font-size:14.5px}
.mov:last-child{border-bottom:none}
.mov .f{color:var(--tinta2);font-size:12.5px;flex-shrink:0;width:76px;font-variant-numeric:tabular-nums}
.mov .t{flex:1;min-width:0}
.mov .m{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.mov .del{color:var(--rojo);border:none;background:none;font-size:15px;cursor:pointer;padding:0 4px}
.dias{display:flex;gap:4px;margin-top:8px}
.dia{width:29px;height:25px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border-radius:6px;background:var(--papel);color:var(--tinta2);border:1px solid var(--linea)}
.dia.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.cabecera .dom{font-family:'Archivo',sans-serif;font-weight:900;font-size:23px;line-height:1.15;text-wrap:balance}
.saldonum{font-family:'Archivo',sans-serif;font-weight:900;font-size:32px;font-variant-numeric:tabular-nums;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.aviso{background:var(--ambarsuave);color:var(--ambar);border-radius:8px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.volver{background:none;border:none;color:var(--azul);font-size:16px;font-weight:600;font-family:inherit;padding:10px 0;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--tinta);color:var(--papel);padding:11px 20px;border-radius:99px;font-weight:600;font-size:14.5px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.ver{opacity:1}
.tag-susp{color:var(--rojo);font-size:12px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#cargando{text-align:center;padding:60px 20px;color:var(--tinta2)}
.subrow{padding:10px 0;border-bottom:1px solid var(--linea)}
.subrow:last-child{border-bottom:none}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.fch{border:1px solid var(--linea);background:var(--tarjeta);color:var(--tinta2);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.fch.on{background:var(--azul);border-color:var(--azul);color:#fff}
.filtros{display:flex;gap:8px;margin:8px 0}
.filtros select,.filtros input{margin-top:0;padding:9px 10px;font-size:14px}
.liqrow{cursor:pointer}
.liqrow .t::after{content:' ▾';color:var(--azul);font-size:12px}
.desglose{background:var(--papel);border:1px dashed var(--linea);border-radius:8px;padding:10px 12px;margin:4px 0 8px;font-size:13.5px}
.desglose .dl{display:flex;justify-content:space-between;padding:3px 0}
.desglose .tot{border-top:1px solid var(--linea);margin-top:6px;padding-top:6px;font-weight:700}
.diasel .dia{cursor:pointer;width:38px;height:34px;font-size:13px}
/* ------- resumen de cuenta (impresión) ------- */
#print-area{display:none}
@media print{
  body{background:#fff!important;color:#000!important;margin:0}
  #appwrap,#tabs,#login,.toast{display:none!important}
  #print-area{display:block!important}
  body.print-hojas #print-area .hoja{display:block}
  @page{size:A4 portrait;margin:5mm 8mm}
  html,body{height:auto!important;overflow:visible!important}
}
.pagina{page-break-after:always;break-after:page}
.pagina:last-child{page-break-after:auto;break-after:auto}
.res{box-sizing:border-box;height:86mm;overflow:hidden;padding:3mm 5mm;border-bottom:1px dashed #999;font:10.5pt/1.3 'IBM Plex Sans',Arial,sans-serif;color:#000;page-break-inside:avoid;break-inside:avoid;position:relative;background:#fff}
.res:last-child{border-bottom:none}
.res .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;border-bottom:1.5px solid #000;padding-bottom:2mm;margin-bottom:2mm}
.res .rh .em b{font-size:12pt}
.res .rh .em div,.res .rh .nr div{font-size:9pt}
.res .rh .nr{text-align:right;white-space:nowrap}
.res .rt{font-weight:700;font-size:11pt;letter-spacing:.2px;margin:0 0 1.5mm}
.res .cl{display:flex;justify-content:space-between;gap:6mm;margin-bottom:2mm}
.res .cl b{font-size:11.5pt}
.res table{width:100%;border-collapse:collapse;font-size:9.5pt}
.res td{padding:.6mm 0}
.res td:last-child{text-align:right;white-space:nowrap}
.res tr.tot td{border-top:1.5px solid #000;font-weight:900;font-size:13pt;padding-top:1.5mm}
.res .pago{margin-top:2mm;padding-top:1.5mm;border-top:1px solid #000;font-size:9.5pt;display:flex;justify-content:space-between;gap:6mm}
.res .pago b{font-family:monospace;font-size:10pt}
.res .ley{font-size:8pt;color:#333;margin-top:1mm}
select.apagado{opacity:.45}
</style>
</head>
<body>
<div id="login" hidden style="max-width:420px;margin:60px auto;padding:0 16px">
  <div class="marca" style="font-family:Archivo,sans-serif;font-weight:900;font-size:28px">COHAJ <span style="color:var(--azul)">· Sistema</span></div>
  <div class="card" style="margin-top:16px">
    <label>Email</label><input id="lemail" type="email" autocomplete="username">
    <label>Contraseña</label><input id="lpass" type="password" autocomplete="current-password">
    <button class="btn" id="lentrar" style="width:100%">Entrar</button>
    <div class="mini" style="margin-top:10px">¿No tenés usuario? Pedíselo a Demian: los usuarios se crean desde adentro del sistema.</div>
    <div class="mini" id="lmsg" style="margin-top:10px"></div>
  </div>
</div>


<div class="wrap" id="appwrap" hidden>
<header><div class="hl"><div class="marca">COHAJ <span>· Sistema</span></div><div class="mini"><span id="estado-db"></span> <span id="lat">v49</span></div></div><div class="hb" id="hbtns"></div></header>
<div id="cargando">Cargando los datos del puesto…</div>
<div id="app" hidden>
  <div id="v-inicio"></div>
  <div id="v-clientes" hidden></div>
  <div id="v-caja" hidden></div>
  <div id="v-precios" hidden></div>

function ultimoCierreISO(){const h=hoyISO();const d=new Date(h+'T12:00:00');d.setDate(0);return d.toISOString().slice(0,10);} // último día del mes anterior (según fecha de Argentina)
function cierresDisponibles(){ // del primer cierre al último mes vencido, más reciente primero
  const out=[]; let d=new Date(ultimoCierreISO()+'T12:00:00');
  while(d.toISOString().slice(0,10)>=PRIMER_CIERRE){ out.push(d.toISOString().slice(0,10)); d=new Date(d.getFullYear(),d.getMonth(),0,12); }

}
function devengoDe(c,tipo,hasta){
  tipo=tipo||'C';
  hasta=hasta||hoyISO();
  const ck='d'+tipo+c.id+'|'+hasta;
  if(SCACHE[ck]!=null) return SCACHE[ck];
  let tot=0; const porPub={};
  const items=c.subs.filter(x=>x[3]==='V'&&x[2]===tipo).map(x=>({t:x[0],days:FDIAS[norm(x[1])],desde:(x[4]||'').slice(0,10),q:Math.abs(x[5])||1}));
  LIVE.novedades.filter(n=>n.cli===c.id&&n.tipo==='Alta'&&n.dias&&((n.via||'C')===tipo)).forEach(n=>items.push({t:n.pub,days:n.dias,desde:(n.desde||'').slice(0,10),q:n.qty||1}));
  if(items.length){
    const hoy=hasta;
    let d=new Date(DEV0+'T12:00:00');
    while(d.toISOString().slice(0,10)<=hoy){
      const dia=d.toISOString().slice(0,10);
      const wd=(d.getDay()+6)%7;
      if(FER.has(dia)){d.setDate(d.getDate()+1);continue;}
      for(const x of items){
        if(!x.days||!x.days.includes(wd)) continue;
        if(x.desde&&x.desde>dia) continue;
        if(suspendida(c.id,x.t,dia)) continue;
        const p=precioDe(x.t,wd,dia);
        if(p){ tot+=p*x.q; porPub[x.t]=(porPub[x.t]||0)+p*x.q; }
      }
      d.setDate(d.getDate()+1);
    }
  }
  SCACHE[ck]=tot; SCACHE['p'+tipo+c.id+'|'+hasta]=porPub;
  return tot;
}

}

function buscarCli(q,n){
  q=norm((q||'').trim()); if(!q) return [];
  if(/^\d+$/.test(q)){const c=C.find(x=>x.id===parseInt(q));return c?[c]:[];}
  const p=q.split(/\s+/);
  return C.filter(c=>p.every(t=>(c.k||'').includes(t))).sort((a,b)=>b.act-a.act).slice(0,n||8);
}
function sugCli(inp){
  const box=$('ncli-ac'); if(!box)return;
  inp.dataset.cli=''; $('ncli-info').textContent=''; $('npubs').innerHTML='';
  const rs=buscarCli(inp.value);
  if(!rs.length){box.hidden=true;return;}
  box.innerHTML=rs.map(c=>`<div class="aci" onmousedown="elegirCli(${c.id})"><b>${c.d}</b> <span class="mini">${c.n?c.n+' · ':''}Nº ${c.id}${c.act?'':' · dado de baja'}</span></div>`).join('');

}
function elegirCli(id){

function cliElegido(){

// Baja de cliente = novedad "Baja" sin publicación; "Reanudación" sin publicación lo reactiva. No toca clientes.activo (el padrón de 166 sigue siendo la base).
function bajaVigente(c,dia){
  dia=dia||hoyISO(); let b=false;
  LIVE.novedades.filter(n=>n.cli===c.id&&!n.pub&&(n.tipo==='Baja'||n.tipo==='Reanudación')&&(n.desde||'')<=dia).sort((x,y)=>(x.desde||'').localeCompare(y.desde||'')||(x.ts||'').localeCompare(y.ts||'')).forEach(n=>{b=(n.tipo==='Baja');});
  return b;
}

function wdDe(iso){return (new Date(iso+'T12:00:00').getDay()+6)%7;}
function fechaParaDia(wd){ // próxima fecha (hoy inclusive) que cae en ese día de semana
  const h=hoyISO(); const d=new Date(h+'T12:00:00'); const cur=(d.getDay()+6)%7; d.setDate(d.getDate()+((wd-cur+7)%7)); return d.toISOString().slice(0,10);
}
function edificioDe(dom){ const m=(dom||'').match(/^(.*?\s\d+)(\s.*)?$/); return m?{ed:m[1],un:(m[2]||'').trim()}:{ed:dom||'',un:''}; }

function entregasDe(c,iso){
  const wd=wdDe(iso); const out=[], res=[];
  if(FER.has(iso)) return {out,res};
  c.subs.filter(x=>x[3]==='V').forEach(x=>{
    const dd=FDIAS[norm(x[1])]; if(!dd||!dd.includes(wd)) return;
    if((x[4]||'').slice(0,10)>iso) return;
    if(suspendida(c.id,x[0],iso)) return;
    const q=x[5]||1; (q<0?res:out).push({pub:x[0],qty:Math.abs(q),via:x[2]});
  });
  LIVE.novedades.filter(n=>n.cli===c.id&&n.tipo==='Alta'&&n.dias&&n.dias.includes(wd)&&(n.desde||'')<=iso&&!suspendida(c.id,n.pub,iso)).forEach(n=>out.push({pub:n.pub,qty:n.qty||1,via:n.via||'C'}));
  return {out,res};
}

    p.addEventListener('dragover',e=>{e.preventDefault(); if(!RDRAG||RDRAG===p)return; const r=p.getBoundingClientRect(); const antes=(e.clientY-r.top)<r.height/2; p.parentElement.insertBefore(RDRAG,antes?p:p.nextSibling);});
  });
  el.querySelectorAll('.vlist').forEach(l=>{
    l.addEventListener('dragover',e=>{e.preventDefault();l.classList.add('over'); if(RDRAG&&!l.contains(RDRAG)&&!e.target.closest('.parada')) l.appendChild(RDRAG);});
    l.addEventListener('dragleave',()=>l.classList.remove('over'));
    l.addEventListener('drop',e=>{e.preventDefault();l.classList.remove('over');guardarOrdenDOM();});
  });

// lee el DOM y guarda vuelta+orden de todos los clientes del día (upsert por cliente/día)
async function guardarOrdenDOM(){

  });

    const{error}=await sb.from('reparto').upsert(rows,{onConflict:'cliente_id,dia'}); if(error)throw new Error(error.message);

let DISTS=[], STOCK_OK=true, CTIPO='compra', PSEL=null, VLOTE='';
const r0=n=>Math.round(n||0);
function precioVenta(p){ return p.modo==='margen'?r0(p.costo*(1+(p.margen||0)/100)):(p.precio||0); }
function prodDe(id){ return LIVE.prod.find(p=>p.id===id); }
function provDe(id){ return LIVE.prov.find(p=>p.id===id); }
function nomProv(id){ const p=provDe(id); return p?p.nombre:(id?'Prov. '+id:'—'); }
function stockDe(pid){
  const s={total:0,propio:0,consig:{}};
  LIVE.stock.filter(m=>m.prod===pid).forEach(m=>{ s.total+=m.qty; if(m.prop==='consignacion'){ s.consig[m.prov||0]=(s.consig[m.prov||0]||0)+m.qty; } else s.propio+=m.qty; });
  Object.keys(s.consig).forEach(k=>{ if(!s.consig[k]) delete s.consig[k]; });
  return s;
}
function saldoProv(pid){ return LIVE.provmov.filter(m=>m.prov===pid).reduce((n,m)=>n+(m.imp||0),0); }
async function ins(table,row){ const{data,error}=await sb.from(table).insert(row).select('id').single(); if(error)throw new Error(error.message); return data.id; }

function optsProv(sel){ return LIVE.prov.filter(p=>p.activo!==false).map(p=>`<option value="${p.id}"${p.id==sel?' selected':''}>${p.nombre}</option>`).join(''); }
function optsProd(conStock,sel){ return LIVE.prod.filter(p=>p.activo!==false).map(p=>({p,s:stockDe(p.id)})).filter(x=>!conStock||x.s.total>0).sort((a,b)=>a.p.nombre.localeCompare(b.p.nombre)).map(x=>`<option value="${x.p.id}"${x.p.id==sel?' selected':''}>${x.p.nombre}${conStock?' · stock '+x.s.total:''}</option>`).join(''); }

async function vender(){
  const pid=parseInt($('v-prod').value); const p=prodDe(pid); if(!p){toast('Elegí el producto');return;}
  const q=parseInt($('v-qty').value)||0, pr=parseFloat($('v-precio').value)||0; if(q<=0||pr<=0){toast('Cantidad y precio');return;}

  const s=stockDe(pid); const disp=prop==='propio'?s.propio:(s.consig[prov]||0);
  if(q>disp&&!confirm('Hay '+disp+' en ese stock y querés vender '+q+'. ¿Seguir igual? (queda en negativo)'))return;
  const medio=$('v-medio').value, f=$('v-fecha').value, nota=$('v-nota').value.trim();
  let cli=null; if(medio==='CC'){ cli=parseInt($('v-cli').dataset.cli)||null; if(!cli){toast('Elegí el cliente');return;} }
  const det=q+'× '+p.nombre;
  try{

    else { cajaId=await ins('caja',{fecha:f,concepto:'Venta de stock',detalle:det+(nota?' · '+nota:''),ingreso:q*pr,egreso:0,medio}); }
    if(prop==='consignacion'&&prov){ provMovId=await ins('prov_movimientos',{proveedor_id:prov,fecha:f,tipo:'consignacion',importe:q*(p.costo||0),detalle:'Vendido en consignación: '+det}); }
    await ins('stock_mov',{producto_id:pid,fecha:f,tipo:'venta',cantidad:-q,propiedad:prop,proveedor_id:prov,costo_unit:p.costo||0,precio_unit:pr,medio:cli?'':medio,cliente_id:cli,caja_id:cajaId,mov_id:movId,prov_mov_id:provMovId,nota});
    await Promise.all(['stock','caja','movs','provmov'].map(cargarTabla)); SCACHE={};
    toast('Venta guardada ✓ '+fmt(q*pr)); pintarVentas(); pintarInicio();
  }catch(e){toast('Error: '+((e&&e.message)||e));}
}

async function registrarCompra(){

      const medio=$('c-medio').value; const cajaId=await ins('caja',{fecha:f,concepto:'Pago a proveedor',detalle:nomProv(prov)+(nota?' · '+nota:''),ingreso:0,egreso:imp,medio});
      await ins('prov_movimientos',{proveedor_id:prov,fecha:f,tipo:'pago',importe:-imp,detalle:(medio+(nota?' · '+nota:'')),caja_id:cajaId});
      await Promise.all(['caja','provmov'].map(cargarTabla)); toast('Pago registrado ✓'); pintarCompras(); pintarInicio(); return;
    }
    const prov=await resolverProv('c-prov'); if(!prov)return;
    const q=parseInt($('c-qty').value)||0; if(q<=0){toast('Poné la cantidad');return;}
    const costo=parseFloat(($('c-costo')||{}).value)||0;

    const det=q+'× '+(p?p.nombre:'');
    if(CTIPO==='compra'){

      if(pago==='cuenta') provMovId=await ins('prov_movimientos',{proveedor_id:prov,fecha:f,tipo:'compra',importe:q*costo,detalle:'Compra: '+det+(nota?' · '+nota:'')});
      else cajaId=await ins('caja',{fecha:f,concepto:'Compra de mercadería',detalle:det+' · '+nomProv(prov)+(nota?' · '+nota:''),ingreso:0,egreso:q*costo,medio:pago});
      await ins('stock_mov',{producto_id:pid,fecha:f,tipo:'compra',cantidad:q,propiedad:'propio',proveedor_id:prov,costo_unit:costo,medio:pago==='cuenta'?'':pago,caja_id:cajaId,prov_mov_id:provMovId,nota});

    } else if(CTIPO==='recepcion'){

    } else if(CTIPO==='devolucion'){
      const prop=$('c-prop').value; let provMovId=null;
      if($('c-credito').checked&&costo) provMovId=await ins('prov_movimientos',{proveedor_id:prov,fecha:f,tipo:'credito',importe:-q*costo,detalle:'Devolución: '+det});
      await ins('stock_mov',{producto_id:pid,fecha:f,tipo:'devolucion',cantidad:-q,propiedad:prop,proveedor_id:prov,costo_unit:costo,prov_mov_id:provMovId,nota});
    }
    await Promise.all(['stock','caja','provmov','prod'].map(cargarTabla)); toast('Registrado ✓'); pintarCompras(); pintarInicio();
  }catch(e){toast('Error: '+((e&&e.message)||e));}
}

/* ---- DISTRIBUIDORES (varios) ---- */
let DSEL=1;
function distDe(id){ return DISTS.find(d=>d.id===id); }
function nomDist(id){ const d=distDe(id); return d?d.nombre:('Distribuidor '+id); }
function pubDist(pub){ const k=norm(pub); const r=LIVE.pubdist.find(x=>norm(x.pub)===k); return r?r.dist:1; }
function devengoPubs(c,tipo,hasta){ hasta=hasta||hoyISO(); devengoDe(c,tipo,hasta); return SCACHE['p'+tipo+c.id+'|'+hasta]||{}; }
function comisionDist(id){ const d=distDe(id); return d&&typeof d.comision==='number'?d.comision:CONFIG.comision; }
function tapaRepartida(distId){ let t=0; C.forEach(c=>{const m=devengoPubs(c,'S'); for(const p in m){ if(distId==null||pubDist(p)===distId) t+=m[p]; }}); return t; }
function comisionDevengada(distId){ if(distId==null){ return DISTS.length?DISTS.reduce((n,d)=>n+comisionDevengada(d.id),0):tapaRepartida()*CONFIG.comision/100; } return tapaRepartida(distId)*comisionDist(distId)/100; }
function saldoDist(distId){ return LIVE.dist.filter(r=>(r.dist||1)===distId).reduce((n,r)=>n+(r.imp||0),0)-comisionDevengada(distId); }

async function apiUsuarios(body){
  const{data,error}=await sb.functions.invoke('usuarios',{body});
  if(error){
    let msg=error.message||String(error);
    try{ const j=await error.context.json(); if(j&&j.error)msg=j.error; }catch(_){}
    if(/Failed to send|Failed to fetch|not found|404/i.test(msg)) msg='La función de usuarios no está publicada en Supabase todavía.';
    throw new Error(msg);
  }
  if(data&&data.error)throw new Error(data.error);
  return data;
}

function emisor(){ return Object.assign({nombre:'',domicilio:'',condicion:'',alias:'',cvu:'',titular:'',titulo:'Resumen de cuenta — no válido como factura',leyenda:''},(CONFIG.raw&&CONFIG.raw.emisor)||{}); }
function armarResumen(c,periodo){ // periodo = último día del mes (ISO)
  const d=new Date(periodo+'T12:00:00'); const y=d.getFullYear(), m=d.getMonth();
  const ini=`${y}-${String(m+1).padStart(2,'0')}-01`;
  const saldo=saldoDe(c,periodo);
  const cm=consumoMes(c,y,m);
  const enMes=f=>f&&f.slice(0,10)>=ini&&f.slice(0,10)<=periodo;
  let cobros=0, ajustes=0;
  c.movs.forEach(x=>{ if(!enMes(x[0]))return; if(x[1]==='Cobro') cobros+=-x[2]; else if(x[1]==='Ajuste') ajustes+=x[2]; });
  LIVE.movs.forEach(x=>{ if(x.cli!==c.id||!enMes(x.f))return; if(x.tipo==='Cobro') cobros+=x.imp; else if(x.tipo==='Ajuste') ajustes+=x.imp; });
  const anterior=saldo-cm.tot-ajustes+cobros;
  const detalle=Object.entries(cm.agg).map(([pub,a])=>({pub,n:a.n,tot:a.tot}));
  return {cliente_id:c.id,periodo,saldo_anterior:+anterior.toFixed(2),consumo:+cm.tot.toFixed(2),cobros:+cobros.toFixed(2),ajustes:+ajustes.toFixed(2),saldo:+saldo.toFixed(2),detalle};
}

/* ------- desglose de una liquidación (reconstrucción) ------- */
// consumo de un mes (solo lo que cobra COHAJ): {agg:{pub:{n,tot,sp}}, tot}
function consumoMes(c,y,m){
  const ini=new Date(y,m,1), fin=new Date(y,m+1,0);
  const agg={}; let sinPrecioN=0;
  let dd=new Date(ini);
  while(dd<=fin){
    const dia=dd.toISOString().slice(0,10), wd=(dd.getDay()+6)%7;
    if(FER.has(dia)){dd.setDate(dd.getDate()+1);continue;}
    for(const x of c.subs){
      if(x[2]!=='C')continue;
      const desde=(x[4]||'').slice(0,10);
      const hasta=x[3]==='V'?'9999':(x[3]||'');
      if(!desde||desde>dia||hasta<dia)continue;
      const days=FDIAS[norm(x[1])];
      if(!days||!days.includes(wd))continue;
      const p=precioDe(x[0],wd,dia);
      const k=x[0];
      agg[k]=agg[k]||{n:0,tot:0,sp:0};
      const qn=Math.abs(x[5])||1;
      agg[k].n+=qn;
      if(p)agg[k].tot+=p*qn; else {agg[k].sp++;sinPrecioN++;}
    }
    dd.setDate(dd.getDate()+1);
  }
  let tot=0; Object.values(agg).forEach(a=>tot+=a.tot);
  return {agg,tot,sinPrecio:sinPrecioN};
}
function desglose(cid,fliq){
  const c=C.find(x=>x.id===cid); if(!c)return '<div class="mini">?</div>';
  const d=new Date(fliq+'T12:00:00');
  let y=d.getFullYear(),m=d.getMonth();
  if(d.getDate()<=5){m--;if(m<0){m=11;y--;}}
  const {agg}=consumoMes(c,y,m);
  const meses=MESES;
  const ks=Object.keys(agg);
  if(!ks.length)return '<div class="mini">No pude reconstruir este período: las suscripciones vigentes hoy no alcanzan a ese mes (pudo haber cambios que NewsPaper ya no conserva).</div>';
  let tot=0;
  let h='<div class="mini" style="margin-bottom:6px">Reconstrucción aproximada del consumo de <b>'+meses[m]+' '+y+'</b> (suscripciones × días × precio de tapa de cada fecha):</div>';
  for(const k of ks){
    tot+=agg[k].tot;
    h+='<div class="dl"><span>'+k+' · '+agg[k].n+' ejemplares'+(agg[k].sp?' <span class="tag-susp">(faltan precios de '+agg[k].sp+' días)</span>':'')+'</span><span>'+(agg[k].tot?fmt(agg[k].tot):'—')+'</span></div>';
  }
  h+='<div class="dl tot"><span>Total reconstruido</span><span>'+fmt(tot)+'</span></div>';
  h+='<div class="mini" style="margin-top:6px">Puede diferir del importe liquidado por NewsPaper: suspensiones puntuales, extras o precios que la base no conserva.</div>';
  return h;
}
