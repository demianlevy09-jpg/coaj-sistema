<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171B">
<title>COHAJ Sistema</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --papel:#F6F4EE; --tarjeta:#FFFFFF; --tinta:#1C1B17; --tinta2:#5C594F;
  --linea:#E2DED2; --azul:#23538F; --azulsuave:#E8EEF7;
  --ok:#1F7A3D; --oksuave:#E4F1E7; --rojo:#B3261E; --rojosuave:#F9E9E7;
  --ambar:#8A6100; --ambarsuave:#F6EED9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#15171B; --tarjeta:#1E2126; --tinta:#EDEAE2; --tinta2:#A5A198;
    --linea:#31353C; --azul:#7FA8DC; --azulsuave:#22314A;
    --ok:#6FC48C; --oksuave:#1D3326; --rojo:#E58B84; --rojosuave:#42221F;
    --ambar:#D9B45C; --ambarsuave:#3A3120;
  }
}
:root[data-theme="dark"]{
  --papel:#15171B; --tarjeta:#1E2126; --tinta:#EDEAE2; --tinta2:#A5A198;
  --linea:#31353C; --azul:#7FA8DC; --azulsuave:#22314A;
  --ok:#6FC48C; --oksuave:#1D3326; --rojo:#E58B84; --rojosuave:#42221F;
  --ambar:#D9B45C; --ambarsuave:#3A3120;
}
*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;margin:0;padding:0 0 86px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{padding:14px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header .hl{display:flex;flex-direction:column;gap:2px;flex:1;min-width:180px}
header .hb{display:flex;gap:6px;margin-left:auto}
header .hb .btn.chico{margin-top:0;padding:8px 12px;font-size:13px}
.segm{display:inline-flex;border:1.5px solid var(--azul);border-radius:99px;overflow:hidden;margin:6px 0 8px}
.segm button{border:none;background:transparent;color:var(--azul);font-family:inherit;font-weight:600;font-size:13px;padding:7px 14px;cursor:pointer}
.segm button.on{background:var(--azul);color:#fff}
.marca{font-family:'Archivo',sans-serif;font-weight:900;font-size:24px;letter-spacing:-.5px}
.marca span{color:var(--azul)}
.mini{font-size:12px;color:var(--tinta2)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--tarjeta);border-top:1px solid var(--linea);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;text-align:center;padding:10px 2px 12px;font-size:12.5px;font-weight:600;color:var(--tinta2);cursor:pointer;border:none;background:none;font-family:inherit}
.tab .ic{display:block;font-size:20px;margin-bottom:1px}
.tab.on{color:var(--azul)}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;padding:14px;margin-bottom:10px}
h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tinta2);margin:20px 0 8px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.stat{background:var(--tarjeta);border:1px solid var(--linea);border-radius:8px;padding:8px 12px;flex:1;min-width:88px}
.stat b{display:block;font-family:'Archivo',sans-serif;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:11px;color:var(--tinta2);text-transform:uppercase;letter-spacing:.4px}
.debe{color:var(--rojo)} .favor{color:var(--ok)} .aldia{color:var(--tinta2)}
input,select{width:100%;font-size:16px;font-family:inherit;padding:12px;border:1.5px solid var(--linea);border-radius:9px;background:var(--tarjeta);color:var(--tinta);outline:none;margin-top:4px}
input:focus,select:focus{border-color:var(--azul)}
label{font-size:13px;font-weight:600;color:var(--tinta2);display:block;margin-top:12px}
.btn{display:inline-block;background:var(--azul);color:#fff;border:none;border-radius:9px;font-family:inherit;font-weight:700;font-size:16px;padding:13px 22px;cursor:pointer;margin-top:14px}
.btn.sec{background:var(--tarjeta);color:var(--azul);border:1.5px solid var(--azul)}
.btn.chico{font-size:14px;padding:9px 14px;margin-top:8px}
.fila{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fila.sel{border-color:var(--azul);background:var(--azulsuave)}
.chk{width:22px;height:22px;border:2px solid var(--azul);border-radius:6px;flex:none;position:relative}
.chk.on{background:var(--azul)}
.chk.on::after{content:'✓';color:#fff;position:absolute;left:4px;top:-1px;font-size:15px;font-weight:900}
.fila .dom{font-weight:600;font-size:16px}
.fila .nom{color:var(--tinta2);font-size:14px}
.fila .der{margin-left:auto;text-align:right;flex-shrink:0}
.monto{font-family:'Archivo',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;font-size:15.5px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px}
.p-susc{background:var(--azulsuave);color:var(--azul)}
.p-cli{background:var(--oksuave);color:var(--ok)}
.p-mix{background:var(--ambarsuave);color:var(--ambar)}
.p-inact{background:var(--linea);color:var(--tinta2)}
.p-warn{background:var(--ambarsuave);color:var(--ambar)}
.mov{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px solid var(--linea);font-size:14.5px}
.mov:last-child{border-bottom:none}
.mov .f{color:var(--tinta2);font-size:12.5px;flex-shrink:0;width:76px;font-variant-numeric:tabular-nums}
.mov .t{flex:1;min-width:0}
.mov .m{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.mov .del{color:var(--rojo);border:none;background:none;font-size:15px;cursor:pointer;padding:0 4px}
.dias{display:flex;gap:4px;margin-top:8px}
.dia{width:29px;height:25px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border-radius:6px;background:var(--papel);color:var(--tinta2);border:1px solid var(--linea)}
.dia.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.cabecera .dom{font-family:'Archivo',sans-serif;font-weight:900;font-size:23px;line-height:1.15;text-wrap:balance}
.saldonum{font-family:'Archivo',sans-serif;font-weight:900;font-size:32px;font-variant-numeric:tabular-nums;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.aviso{background:var(--ambarsuave);color:var(--ambar);border-radius:8px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.volver{background:none;border:none;color:var(--azul);font-size:16px;font-weight:600;font-family:inherit;padding:10px 0;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--tinta);color:var(--papel);padding:11px 20px;border-radius:99px;font-weight:600;font-size:14.5px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.ver{opacity:1}
.tag-susp{color:var(--rojo);font-size:12px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#cargando{text-align:center;padding:60px 20px;color:var(--tinta2)}
.subrow{padding:10px 0;border-bottom:1px solid var(--linea)}
.subrow:last-child{border-bottom:none}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.fch{border:1px solid var(--linea);background:var(--tarjeta);color:var(--tinta2);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.fch.on{background:var(--azul);border-color:var(--azul);color:#fff}
.filtros{display:flex;gap:8px;margin:8px 0}
.filtros select,.filtros input{margin-top:0;padding:9px 10px;font-size:14px}
.liqrow{cursor:pointer}
.liqrow .t::after{content:' ▾';color:var(--azul);font-size:12px}
.desglose{background:var(--papel);border:1px dashed var(--linea);border-radius:8px;padding:10px 12px;margin:4px 0 8px;font-size:13.5px}
.desglose .dl{display:flex;justify-content:space-between;padding:3px 0}
.desglose .tot{border-top:1px solid var(--linea);margin-top:6px;padding-top:6px;font-weight:700}
.diasel .dia{cursor:pointer;width:38px;height:34px;font-size:13px}
/* ------- resumen de cuenta (impresión) ------- */
#print-area{display:none}
@media print{
  body{background:#fff!important;color:#000!important;margin:0}
  #appwrap,#tabs,#login,.toast{display:none!important}
  #print-area{display:block!important}
  @page{size:A4 portrait;margin:5mm 8mm}
  html,body{height:auto!important;overflow:visible!important}
}
.pagina{page-break-after:always;break-after:page}
.pagina:last-child{page-break-after:auto;break-after:auto}
.res{box-sizing:border-box;height:86mm;overflow:hidden;padding:3mm 5mm;border-bottom:1px dashed #999;font:10.5pt/1.3 'IBM Plex Sans',Arial,sans-serif;color:#000;page-break-inside:avoid;break-inside:avoid;position:relative;background:#fff}
.res:last-child{border-bottom:none}
.res .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;border-bottom:1.5px solid #000;padding-bottom:2mm;margin-bottom:2mm}
.res .rh .em b{font-size:12pt}
.res .rh .em div,.res .rh .nr div{font-size:9pt}
.res .rh .nr{text-align:right;white-space:nowrap}
.res .rt{font-weight:700;font-size:11pt;letter-spacing:.2px;margin:0 0 1.5mm}
.res .cl{display:flex;justify-content:space-between;gap:6mm;margin-bottom:2mm}
.res .cl b{font-size:11.5pt}
.res table{width:100%;border-collapse:collapse;font-size:9.5pt}
.res td{padding:.6mm 0}
.res td:last-child{text-align:right;white-space:nowrap}
.res tr.tot td{border-top:1.5px solid #000;font-weight:900;font-size:13pt;padding-top:1.5mm}
.res .pago{margin-top:2mm;padding-top:1.5mm;border-top:1px solid #000;font-size:9.5pt;display:flex;justify-content:space-between;gap:6mm}
.res .pago b{font-family:monospace;font-size:10pt}
.res .ley{font-size:8pt;color:#333;margin-top:1mm}
select.apagado{opacity:.45}
</style>
</head>

function traducirAuth(m){
  m=String(m||'');
  if(/Invalid login/i.test(m))return 'Email o contraseña incorrectos';
  if(/Email not confirmed/i.test(m))return 'Ese usuario todavía no está habilitado. Avisale a Demian.';
  if(/banned|user is banned/i.test(m))return 'Ese usuario está bloqueado. Avisale a Demian.';
  if(/at least 6/i.test(m))return 'La contraseña tiene que tener al menos 6 caracteres';
  if(/rate limit|too many/i.test(m))return 'Demasiados intentos, esperá un minuto';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sin conexión. Revisá internet y probá de nuevo.';
  return 'Error: '+m;
}
async function gate(){
  let{data:{session}}=await sb.auth.getSession();
  if(session){
    const{data:{user},error}=await sb.auth.getUser();
    if(error||!user){ try{const r=await sb.auth.refreshSession();session=r.data.session;}catch(_){session=null;} }
  }
  if(session){USUARIO=session.user;$('login').hidden=true;$('appwrap').hidden=false;iniciarApp();}
  else{try{await sb.auth.signOut();}catch(_){}$('login').hidden=false;$('cargando').hidden=true;}
}

    try{
      const{error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      USUARIO=(await sb.auth.getSession()).data.session?.user||null;
      $('login').hidden=true;$('appwrap').hidden=false;$('cargando').hidden=false;iniciarApp();
    }catch(err){$('lmsg').textContent=traducirAuth(err.message||err);}
  }
  if(e.target.id==='lsalir'){await sb.auth.signOut();location.reload();}
});
</script>
<script>

let db=null, C=[], PRECIOS=[], CAJAH=[], LISTAS={medios:[],conceptos:[],tipos:[]};
const CONCEPTOS_CAJA=['Cobro a cliente','Venta mostrador','Cobro distribuidora','Pago a distribuidora','Pago a empleado','Gasto','Retiro','Cambio inicial','Transferencia entre cuentas','Otro'];
let LIVE={movs:[],caja:[],precios:[],novedades:[],dist:[],feriados:[],devol:[]};
let FER=new Set(); // fechas ISO sin reparto
let CONFIG={comision:32}; // % del precio de tapa que le corresponde a COHAJ por lo repartido a suscriptores (dato de Demian 09/09: 32%)
let DISTH=[];
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.abs(n).toLocaleString('es-AR',{maximumFractionDigits:0});
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const hoyISO=()=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}catch(_){return new Date().toISOString().slice(0,10);}};
const fecha=s=>{if(!s)return'';const[a,m,d]=s.slice(0,10).split('-');return d+'/'+m+'/'+a.slice(2);};
const DIAS=['Lu','Ma','Mi','Ju','Vi','Sa','Do'];
const FDIAS={'lunes':[0],'martes':[1],'miercoles':[2],'jueves':[3],'viernes':[4],'sabado':[5],'domingo':[6],'todos los dias':[0,1,2,3,4,5,6],'de lunes a viernes':[0,1,2,3,4],'lunes a viernes':[0,1,2,3,4],'de lunes a sabado':[0,1,2,3,4,5],'lunes a sabado':[0,1,2,3,4,5],'sabado y domingo':[5,6],'lunes y jueves':[0,3],'lunes, miercoles y viernes':[0,2,4],'martes y viernes':[1,4],'martes y jueves':[1,3],'jueves y sabado':[3,5]};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('ver');setTimeout(()=>t.classList.remove('ver'),2200);}
const dget=snap=>(snap&&typeof snap.data==='function')?snap.data():snap;

/* ------- capa de datos: tablas de Supabase (v33) ------- */
const TABLAS={movs:'movimientos',caja:'caja',precios:'precios',novedades:'novedades',dist:'dist_movimientos',feriados:'feriados',devol:'devoluciones'};
const A_DB={
  movs:r=>({cliente_id:r.cli,fecha:r.f,tipo:r.tipo,importe:r.imp,medio:r.medio||'',nota:r.nota||''}),
  caja:r=>({fecha:r.f,concepto:r.c,detalle:r.d||'',ingreso:r.ing||0,egreso:r.egr||0,medio:r.m||'Efectivo',movimiento_id:r.mid||null}),
  precios:r=>({publicacion:r.pub,dia:r.dia==null?null:r.dia,desde:r.desde,precio:r.precio}),
  novedades:r=>({cliente_id:r.cli,tipo:r.tipo,publicacion:r.pub||'',desde:r.desde||null,hasta:r.hasta||null,dias:r.dias||null,via:r.via||null,cantidad:r.qty||null,nota:r.nota||''}),
  dist:r=>({distribuidor_id:r.dist||1,fecha:r.f,detalle:r.d||'',importe:r.imp}),
  feriados:r=>({fecha:r.f,motivo:r.d||''}),
  devol:r=>({distribuidor_id:1,fecha:r.f,publicacion:r.pub,cantidad:r.qty,nota:r.nota||''})
};
const DE_DB={
  movs:x=>({id:String(x.id),ts:x.creado_en,cli:x.cliente_id,tipo:x.tipo,imp:Number(x.importe),f:x.fecha,medio:x.medio||'',nota:x.nota||'',fijo:x.fijo?1:0}),
  caja:x=>({id:String(x.id),ts:x.creado_en,f:x.fecha,c:x.concepto,d:x.detalle||'',ing:Number(x.ingreso)||0,egr:Number(x.egreso)||0,m:x.medio||'',fijo:x.fijo?1:0}),
  precios:x=>({id:String(x.id),pub:x.publicacion,dia:x.dia==null?null:x.dia,desde:x.desde,precio:Number(x.precio),nuevo:x.origen!=='newspaper'?1:0,ts:x.creado_en}),
  novedades:x=>({id:String(x.id),ts:x.creado_en,cli:x.cliente_id,tipo:x.tipo,pub:x.publicacion||'',desde:x.desde||'',hasta:x.hasta||'',dias:x.dias||null,via:x.via||null,qty:x.cantidad||null,nota:x.nota||''}),
  dist:x=>({id:String(x.id),ts:x.creado_en,f:x.fecha,d:x.detalle||'',imp:Number(x.importe),dist:x.distribuidor_id}),
  feriados:x=>({id:x.fecha,f:x.fecha,d:x.motivo||''}),
  devol:x=>({id:String(x.id),ts:x.creado_en,f:x.fecha,pub:x.publicacion,qty:x.cantidad,nota:x.nota||'',dist:x.distribuidor_id})
};
async function todo(mk){ // trae todas las filas paginando de a 1000
  let out=[],from=0;
  for(;;){ const{data,error}=await mk().range(from,from+999); if(error)throw error; out.push(...data); if(data.length<1000)break; from+=1000; }
  return out;
}
async function cargarTabla(col){
  const t=TABLAS[col];
  let rows=await todo(()=>sb.from(t).select('*').eq('anulado',false).order(t==='feriados'?'fecha':'id',{ascending:true}));
  if(col==='movs'){ const ids=new Set(C.map(c=>c.id)); rows=rows.filter(x=>x.origen!=='newspaper'&&ids.has(x.cliente_id)); }
  if(col==='caja'){ CAJAH=rows.filter(x=>x.origen==='newspaper').map(x=>({f:x.fecha+(x.hora?' '+String(x.hora).slice(0,5):''),c:x.concepto,d:x.detalle||'',i:Number(x.ingreso)||0,e:Number(x.egreso)||0,m:x.medio||''})); rows=rows.filter(x=>x.origen!=='newspaper'); }
  if(col==='precios'){ PRECIOS=rows.filter(x=>x.origen==='newspaper').map(DE_DB.precios); rows=rows.filter(x=>x.origen!=='newspaper'); }

/* ------- precios ------- */
let PIDX={};
function armarPIDX(){
  PIDX={};
  [...PRECIOS,...LIVE.precios].forEach(p=>{
    const k=norm(p.pub)+'|'+(p.dia==null?'x':p.dia);
    (PIDX[k]=PIDX[k]||[]).push(p);
  });
  Object.values(PIDX).forEach(v=>v.sort((a,b)=>(a.desde||'').localeCompare(b.desde||'')));
  SCACHE={};
}
function precioDe(pub,wd,dia){
  for(const k of [norm(pub)+'|'+wd,norm(pub)+'|x']){
    const v=PIDX[k]; if(!v) continue;
    let best=null;
    for(const p of v){ if(p.desde<=dia) best=p.precio; else break; }
    if(best) return best;
  }
  return null;
}
/* ------- devengo diario (desde 01/09/2026; la liquidación del 02/09 cubrió agosto) ------- */
const DEV0='2026-09-01';
function suspendida(cli,titulo,dia){
  let sus=false;
  const nvs=LIVE.novedades.filter(n=>n.cli===cli&&(!n.pub||norm(titulo).includes(norm(n.pub))||norm(n.pub).includes(norm(titulo)))).sort((a,b)=>(a.desde||'').localeCompare(b.desde||''));
  for(const n of nvs){
    if((n.desde||'')<=dia){
      if(n.tipo==='Suspensión'||n.tipo==='Baja'){ if(!n.hasta||n.hasta>=dia) sus=true; else sus=false; }
      if(n.tipo==='Reanudación'||n.tipo==='Alta') sus=false;
    }
  }
  return sus;
}
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let SCACHE={};
// Modo de saldo: 'vivo' (hasta hoy) o 'cierre' (hasta el último cierre mensual = fin del mes anterior)
let MODO_SALDO='vivo', CIERRE_SEL=''; try{MODO_SALDO=localStorage.getItem('modoSaldo')||'vivo';CIERRE_SEL=localStorage.getItem('cierreSel')||'';}catch(_){}
const PRIMER_CIERRE='2026-08-31'; // primer mes vencido que existe en el sistema
function ultimoCierreISO(){const h=hoyISO();const d=new Date(h+'T12:00:00');d.setDate(0);return d.toISOString().slice(0,10);} // último día del mes anterior (según fecha de Argentina)
function cierresDisponibles(){ // del primer cierre al último mes vencido, más reciente primero
  const out=[]; let d=new Date(ultimoCierreISO()+'T12:00:00');
  while(d.toISOString().slice(0,10)>=PRIMER_CIERRE){ out.push(d.toISOString().slice(0,10)); d=new Date(d.getFullYear(),d.getMonth(),0,12); }
  return out;
}
function cierreISO(){ const disp=cierresDisponibles(); return (CIERRE_SEL&&disp.includes(CIERRE_SEL))?CIERRE_SEL:(disp[0]||ultimoCierreISO()); } // cierre elegido (por defecto, el último mes vencido)
function hastaSaldo(){return MODO_SALDO==='cierre'?cierreISO():hoyISO();}
function setModoSaldo(m,cierre){MODO_SALDO=m;if(cierre)CIERRE_SEL=cierre;try{localStorage.setItem('modoSaldo',m);localStorage.setItem('cierreSel',CIERRE_SEL);}catch(_){}pintarInicio();pintarClientes();}
function etiquetaMes(iso){const d=new Date(iso+'T12:00:00');return MESES[d.getMonth()]+' '+d.getFullYear();}
function toggleSaldoHTML(){
  const disp=cierresDisponibles(), sel=cierreISO();
  return `<div class="segm"><button class="${MODO_SALDO==='vivo'?'on':''}" onclick="setModoSaldo('vivo')">En vivo (hoy)</button><button class="${MODO_SALDO==='cierre'?'on':''}" onclick="setModoSaldo('cierre')">Mes vencido</button></div>
  <select id="selcierre" class="${MODO_SALDO==='cierre'?'':'apagado'}" style="display:inline-block;width:auto;margin:6px 0 8px 8px;padding:6px 10px;font-size:13px" onchange="setModoSaldo('cierre',this.value)">${disp.map(x=>`<option value="${x}"${x===sel?' selected':''}>al ${fecha(x)} · ${etiquetaMes(x)}</option>`).join('')}</select>`;
}
function devengoDe(c,tipo,hasta){
  tipo=tipo||'C';
  hasta=hasta||hoyISO();
  const ck='d'+tipo+c.id+'|'+hasta;
  if(SCACHE[ck]!=null) return SCACHE[ck];
  let tot=0;
  const items=c.subs.filter(x=>x[3]==='V'&&x[2]===tipo).map(x=>({t:x[0],days:FDIAS[norm(x[1])],desde:(x[4]||'').slice(0,10),q:Math.abs(x[5])||1}));
  LIVE.novedades.filter(n=>n.cli===c.id&&n.tipo==='Alta'&&n.dias&&((n.via||'C')===tipo)).forEach(n=>items.push({t:n.pub,days:n.dias,desde:(n.desde||'').slice(0,10),q:n.qty||1}));
  if(items.length){
    const hoy=hasta;
    let d=new Date(DEV0+'T12:00:00');
    while(d.toISOString().slice(0,10)<=hoy){
      const dia=d.toISOString().slice(0,10);
      const wd=(d.getDay()+6)%7;
      if(FER.has(dia)){d.setDate(d.getDate()+1);continue;}
      for(const x of items){
        if(!x.days||!x.days.includes(wd)) continue;
        if(x.desde&&x.desde>dia) continue;
        if(suspendida(c.id,x.t,dia)) continue;
        const p=precioDe(x.t,wd,dia);
        if(p) tot+=p*x.q;
      }
      d.setDate(d.getDate()+1);
    }
  }
  SCACHE[ck]=tot;
  return tot;
}

function saldoDe(c,hasta){
  hasta=hasta||hastaSaldo();
  let s=c.sal+devengoDe(c,'C',hasta);
  for(const m of LIVE.movs) if(m.cli===c.id&&(m.f||'').slice(0,10)<=hasta) s+=(m.tipo==='Cobro'?-m.imp:m.imp);
  return s;
}

let RES=[],MOSTR=30,FSEL=new Set(); // filtros seleccionados (varios a la vez)
let SELMODE=false, SELCLI=new Set(); // selección de clientes para imprimir resúmenes
// Grupos de filtros: dentro de un grupo se suman (O); entre grupos se cruzan (Y).
// Tipo: puesto = SOLO le cobrás vos · distrib = SOLO vía distribuidora · mixto = las dos cosas.
const FGRUPOS={tipo:['puesto','distrib','mixto','sinsub'],saldo:['deudores','favor'],estado:['inactivos','recup']};
const FTEST={
  puesto:c=>catDe(c)==='Cliente', distrib:c=>catDe(c)==='Suscriptor', mixto:c=>catDe(c)==='Mixto', sinsub:c=>catDe(c)==='',

function pasaFiltro(c,s){
  for(const g of Object.values(FGRUPOS)){
    const act=g.filter(k=>FSEL.has(k));
    if(act.length&&!act.some(k=>FTEST[k](c,s))) return false;
  }

}
function buscar(){
 try{
  const el=$('bq');
  const q=norm(((el||{}).value||'').trim());
  window.__dbg='q=«'+q+'»';

 }catch(e){

function catDe(c){
  const hoy=hoyISO();
  const vias=new Set();
  c.subs.forEach(x=>{ if(x[3]==='V'&&!suspendida(c.id,x[0],hoy)) vias.add(x[2]==='S'?'S':'C'); });
  LIVE.novedades.filter(n=>n.cli===c.id&&n.tipo==='Alta'&&n.dias&&!suspendida(c.id,n.pub,hoy)).forEach(n=>vias.add((n.via||'C')==='S'?'S':'C'));
  if(vias.has('S')&&vias.has('C'))return 'Mixto';
  if(vias.has('S'))return 'Suscriptor';
  if(vias.has('C'))return 'Cliente';
  return '';

function emisor(){ return Object.assign({nombre:'',domicilio:'',condicion:'',alias:'',cvu:'',titular:'',titulo:'Resumen de cuenta — no válido como factura',leyenda:''},(CONFIG.raw&&CONFIG.raw.emisor)||{}); }
function armarResumen(c,periodo){ // periodo = último día del mes (ISO)
  const d=new Date(periodo+'T12:00:00'); const y=d.getFullYear(), m=d.getMonth();
  const ini=`${y}-${String(m+1).padStart(2,'0')}-01`;
  const saldo=saldoDe(c,periodo);
  const cm=consumoMes(c,y,m);
  const enMes=f=>f&&f.slice(0,10)>=ini&&f.slice(0,10)<=periodo;
  let cobros=0, ajustes=0;
  c.movs.forEach(x=>{ if(!enMes(x[0]))return; if(x[1]==='Cobro') cobros+=-x[2]; else if(x[1]==='Ajuste') ajustes+=x[2]; });
  LIVE.movs.forEach(x=>{ if(x.cli!==c.id||!enMes(x.f))return; if(x.tipo==='Cobro') cobros+=x.imp; else if(x.tipo==='Ajuste') ajustes+=x.imp; });
  const anterior=saldo-cm.tot-ajustes+cobros;
  const detalle=Object.entries(cm.agg).map(([pub,a])=>({pub,n:a.n,tot:a.tot}));
  return {cliente_id:c.id,periodo,saldo_anterior:+anterior.toFixed(2),consumo:+cm.tot.toFixed(2),cobros:+cobros.toFixed(2),ajustes:+ajustes.toFixed(2),saldo:+saldo.toFixed(2),detalle};
}

// consumo de un mes (solo lo que cobra COHAJ): {agg:{pub:{n,tot,sp}}, tot}
function consumoMes(c,y,m){
  const ini=new Date(y,m,1), fin=new Date(y,m+1,0);
  const agg={}; let sinPrecioN=0;
  let dd=new Date(ini);
  while(dd<=fin){
    const dia=dd.toISOString().slice(0,10), wd=(dd.getDay()+6)%7;
    if(FER.has(dia)){dd.setDate(dd.getDate()+1);continue;}
    for(const x of c.subs){
      if(x[2]!=='C')continue;
      const desde=(x[4]||'').slice(0,10);
      const hasta=x[3]==='V'?'9999':(x[3]||'');
      if(!desde||desde>dia||hasta<dia)continue;
      const days=FDIAS[norm(x[1])];
      if(!days||!days.includes(wd))continue;
      const p=precioDe(x[0],wd,dia);
      const k=x[0];
      agg[k]=agg[k]||{n:0,tot:0,sp:0};
      const qn=Math.abs(x[5])||1;
      agg[k].n+=qn;
      if(p)agg[k].tot+=p*qn; else {agg[k].sp++;sinPrecioN++;}
    }
    dd.setDate(dd.getDate()+1);
  }
  let tot=0; Object.values(agg).forEach(a=>tot+=a.tot);
  return {agg,tot,sinPrecio:sinPrecioN};
}
function desglose(cid,fliq){
  const c=C.find(x=>x.id===cid); if(!c)return '<div class="mini">?</div>';
  const d=new Date(fliq+'T12:00:00');
  let y=d.getFullYear(),m=d.getMonth();
  if(d.getDate()<=5){m--;if(m<0){m=11;y--;}}
  const {agg}=consumoMes(c,y,m);
  const meses=MESES;
  const ks=Object.keys(agg);
  if(!ks.length)return '<div class="mini">No pude reconstruir este período: las suscripciones vigentes hoy no alcanzan a ese mes (pudo haber cambios que NewsPaper ya no conserva).</div>';
  let tot=0;
  let h='<div class="mini" style="margin-bottom:6px">Reconstrucción aproximada del consumo de <b>'+meses[m]+' '+y+'</b> (suscripciones × días × precio de tapa de cada fecha):</div>';
  for(const k of ks){
    tot+=agg[k].tot;
    h+='<div class="dl"><span>'+k+' · '+agg[k].n+' ejemplares'+(agg[k].sp?' <span class="tag-susp">(faltan precios de '+agg[k].sp+' días)</span>':'')+'</span><span>'+(agg[k].tot?fmt(agg[k].tot):'—')+'</span></div>';
  }
  h+='<div class="dl tot"><span>Total reconstruido</span><span>'+fmt(tot)+'</span></div>';
  h+='<div class="mini" style="margin-top:6px">Puede diferir del importe liquidado por NewsPaper: suspensiones puntuales, extras o precios que la base no conserva.</div>';
  return h;
}

    <label>Días que la recibe</label><div class="dias diasel" id="adias">${DIAS.map((d,i)=>`<div class="dia" data-di="${i}">${d}</div>`).join('')}</div>
    <label>¿Quién cobra?</label><select id="avia"><option value="C">Le cobrás vos (cuenta corriente)</option><option value="S">Vía distribuidora (suscripción)</option></select>
    <div class="grid2"><div><label>Ejemplares por día (casi siempre 1)</label><input id="aqty" type="number" value="1" min="1"></div>
    <div><label>Desde</label><input id="adesde" type="date" value="${hoyISO()}"></div></div>
    <button class="btn" data-altaok data-cli="${ab.dataset.cli}">Guardar alta</button></div>`;
    return;
  }
  const di=e.target.closest('.diasel .dia');
  if(di){di.classList.toggle('on');return;}
  const ao=e.target.closest('[data-altaok]');
  if(ao){
    const pub=($('apub').value||'').trim().toUpperCase();
    const dias=[...document.querySelectorAll('#adias .dia.on')].map(x=>parseInt(x.dataset.di));
    if(!pub){toast('Poné la publicación');return;}
    if(!dias.length){toast('Marcá al menos un día');return;}
    const cli=parseInt(ao.dataset.cli);
    const r={id:nid(),ts:new Date().toISOString(),cli,tipo:'Alta',pub,desde:$('adesde').value,hasta:'',dias,via:$('avia').value,qty:parseInt($('aqty').value)||1,nota:'alta desde la ficha'};
    guardar('novedades',[...LIVE.novedades,r]).then(()=>{toast('Alta guardada ✓');ficha(cli);}).catch(err=>toast('Error: '+(err&&err.message)));
    return;
  }
  const sok=e.target.closest('[data-sok]');
  if(sok){
    const f=sok.parentElement.querySelector('.sfec').value;
    const cli=parseInt(sok.dataset.cli);
    const r={id:nid(),ts:new Date().toISOString(),cli,tipo:sok.dataset.acc,pub:sok.dataset.pub,desde:f,hasta:'',nota:'desde la ficha'};
    guardar('novedades',[...LIVE.novedades,r]).then(()=>{toast(sok.dataset.acc+' guardada ✓');ficha(cli);}).catch(err=>toast('Error: '+(err&&err.message)));
    return;
  }
  const lq=e.target.closest('.liqrow');
  if(lq){
    const dg=document.querySelector('.desglose[data-dg="'+lq.dataset.dlq+'_'+lq.dataset.dlc+'"]');
    if(dg){ if(dg.hidden){dg.innerHTML=desglose(parseInt(lq.dataset.dlc),lq.dataset.dlq);dg.hidden=false;} else dg.hidden=true; }
    return;
  }
  const fila=e.target.closest('.fila[data-cli]');
  if(fila){ if(SELMODE) toggleSel(parseInt(fila.dataset.cli)); else ficha(parseInt(fila.dataset.cli)); return;}
  const id=e.target.closest('button')&&e.target.closest('button').id;
  const b=e.target.closest('button');
  switch(id){
    case 'bmas': MOSTR+=30;pintarLista();break;
    case 'qcobrar': ver('clientes');setTimeout(()=>$('bq')&&$('bq').focus(),50);break;
    case 'qcaja': ver('caja');pintarCaja();break;
    case 'qusuarios': ver('usuarios');pintarUsuarios();break;
    case 'dmas': masDist();break;
    case 'uvolver': ver('inicio');pintarInicio();break;
    case 'uok': crearUsuario();break;
    case 'uclave': cambiarClave(b.dataset.uid,b.dataset.email);break;
    case 'ubloq': bloquearUsuario(b.dataset.uid,b.dataset.email,b.dataset.bloq==='1');break;
    case 'uborrar': borrarUsuario(b.dataset.uid,b.dataset.email);break;
    case 'fvolver': ver('clientes');buscar();break;
    case 'fmas': {const y=window.scrollY;ficha(parseInt(b.dataset.cli),true);window.scrollTo(0,y);break;}
    case 'fbc': formCobro(parseInt(b.dataset.cli));break;
    case 'fbl': formLiq(parseInt(b.dataset.cli));break;
    case 'fres': imprimirResumenes([parseInt(b.dataset.cli)]);break;
    case 'bimp': {const ids=RES.filter(x=>saldoDe(x.c,cierreISO())>0.5).map(x=>x.c.id); if(!ids.length){toast('Nadie con saldo deudor al '+fecha(cierreISO()));break;} imprimirResumenes(ids);break;}
    case 'bsel': SELMODE=true;SELCLI.clear();buscar();break;
    case 'bselno': SELMODE=false;SELCLI.clear();buscar();break;
    case 'bseltodos': RES.forEach(x=>SELCLI.add(x.c.id));buscar();break;
    case 'bimpsel': {const ids=[...SELCLI]; if(!ids.length){toast('Marcá al menos un cliente');break;} imprimirResumenes(ids);break;}
    case 'emok': guardarEmisor();break;
    case 'fok': addMov(parseInt(b.dataset.cli),b.dataset.tipo);break;
    case 'cok': addCaja();break;
    case 'pok': addPrecio();break;
    case 'nok': addNov();break;
    case 'dok': addDist();break;
    case 'dcomok': guardarComision();break;
    case 'feok': addFeriado();break;
    case 'dvok': addDevol();break;
  }
});
document.addEventListener('input',function(e){
  NEV++;
  switch(e.target.id){
    case 'bq': buscar();break;
    case 'fct': if(window.pintaC)pintaC();break;
    case 'fch2': if(window.pintaH)pintaH();break;
    case 'pfil': {const q=norm(e.target.value);document.querySelectorAll('#plist .card').forEach(c=>{c.hidden=q&&!norm(c.textContent).includes(q);});break;}
    case 'nft': if(window.pintaN)pintaN();break;
    case 'dfil': if(window.pintaDH)pintaDH();break;
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='fcc'||e.target.id==='fcm'){if(window.pintaC)pintaC();}
  if(e.target.id==='nfil'){if(window.pintaN)pintaN();}
});


async function iniciarApp(){
  try{
    await boot();
    if(!C.length)return;
    (function(){
      const hs=(location.hash||'').slice(1);
      if(!hs)return;
      const mf=hs.match(/^ficha-(\d+)$/);
      if(mf){ficha(parseInt(mf[1]));return;}
      if(hs==='usuarios'){if(esAdmin()){ver('usuarios');pintarUsuarios();}return;}
      if(VISTAS.includes(hs)&&hs!=='ficha'){ver(hs);const p={caja:pintarCaja,precios:pintarPrecios,novedades:pintarNovedades,dist:pintarDist}[hs];if(p)p();}
    })();
    const hdrEl=document.getElementById('hbtns');
    if(hdrEl&&!document.getElementById('lsalir')){
      if(esAdmin()){const x=document.createElement('button');x.id='qexport';x.className='btn chico sec';x.textContent='Backup';x.title='Descargar una copia de todos los datos';x.onclick=exportarTodo;hdrEl.appendChild(x);const u=document.createElement('button');u.id='qusuarios';u.className='btn chico sec';u.textContent='Usuarios';hdrEl.appendChild(u);}
      const b=document.createElement('button');b.id='lsalir';b.className='btn chico sec';b.textContent='Salir';hdrEl.appendChild(b);
      if(PERFIL&&PERFIL.rol){const e=$('estado-db');e.textContent='☁ guardado · '+(PERFIL.rol==='admin'?'admin':'operador');e.title=USUARIO.email||'';}
    }
  }catch(e){$('cargando').innerHTML='Error: '+(e.message||e);}
}
gate();
</script>
</body>
