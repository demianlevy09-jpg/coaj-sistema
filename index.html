<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<script>/* v84: tema antes de pintar (oscuro por defecto, "Modo día" se recuerda en este aparato) */
try{if(localStorage.getItem('cohaj-tema')==='light'){document.documentElement.dataset.theme='light';document.querySelector('meta[name=theme-color]').content='#F7F8FA';}}catch(_){}</script>
<title>COHAJ Sistema</title>
<link rel="stylesheet" href="css/app.css?v=89">
</head>
<body>
<div id="login" hidden style="max-width:420px;margin:60px auto;padding:0 16px">
  <div class="marca" style="font-weight:700;font-size:26px">COHAJ <span style="color:var(--azul)">· Sistema</span></div>
  <div class="card" style="margin-top:16px">
    <label>Email</label><input id="lemail" type="email" autocomplete="username">
    <label>Contraseña</label><input id="lpass" type="password" autocomplete="current-password">
    <button class="btn" id="lentrar" style="width:100%">Entrar</button>
    <div class="mini" style="margin-top:10px">¿No tenés usuario? Pedíselo a Demian: los usuarios se crean desde adentro del sistema.</div>
    <div class="mini" id="lmsg" style="margin-top:10px"></div>
  </div>
</div>


<div class="wrap" id="appwrap" hidden>
<header><div class="hl"><div class="marca">COHAJ<span>.</span></div><div class="mini"><span id="estado-db"></span> <span id="lat">v89</span></div></div><div class="hb" id="hbtns"></div></header>
<div id="cargando">Cargando los datos del puesto…</div>
<div id="app" hidden>
  <div id="v-inicio"></div>
  <div id="v-clientes" hidden></div>
  <div id="v-caja" hidden></div>
  <div id="v-precios" hidden></div>
  <div id="v-novedades" hidden></div>
  <div id="v-dist" hidden></div>
  <div id="v-reparto" hidden></div>
  <div id="v-ventas" hidden></div>
  <div id="v-stock" hidden></div>
  <div id="v-compras" hidden></div>
  <div id="v-ficha" hidden></div>
  <div id="v-usuarios" hidden></div>
</div>
</div>
<nav class="tabs" id="tabs" hidden>
  <div class="sb-top"><div class="marca">COHAJ<span>.</span></div><div class="mini" id="sb-user"></div></div>
  <div class="sb-nav">
  <button class="tab on" data-v="inicio"><span class="ic">▦</span><span class="tl-c">Inicio</span><span class="tl-l">Inicio</span></button>
  <button class="tab" data-v="clientes"><span class="ic">⌂</span><span class="tl-c">Clientes</span><span class="tl-l">Clientes y cuentas corrientes</span></button>
  <button class="tab" data-v="caja"><span class="ic">$</span><span class="tl-c">Caja</span><span class="tl-l">Caja</span></button>
  <button class="tab" data-v="reparto"><span class="ic">➤</span><span class="tl-c">Reparto</span><span class="tl-l">Reparto</span></button>
  <button class="tab" data-v="ventas"><span class="ic">▣</span><span class="tl-c">Ventas</span><span class="tl-l">Ventas</span></button>
  <button class="tab tsec" data-v="stock"><span class="ic">▤</span><span class="tl-c">Stock</span><span class="tl-l">Stock</span></button>
  <button class="tab tsec" data-v="compras"><span class="ic">⇩</span><span class="tl-c">Compras</span><span class="tl-l">Compras e ingresos</span></button>
  <button class="tab tsec" data-v="novedades"><span class="ic">✎</span><span class="tl-c">Noved.</span><span class="tl-l">Novedades</span></button>
  <button class="tab tsec" data-v="precios"><span class="ic">%</span><span class="tl-c">Precios</span><span class="tl-l">Precios</span></button>
  <button class="tab tsec" data-v="dist"><span class="ic">⇄</span><span class="tl-c">Distrib.</span><span class="tl-l">Distribuidores</span></button>
  <button class="tab mas" id="tabmas"><span class="ic">⋯</span><span class="tl-c">Más</span></button>
  </div>
  <div id="massheet" class="massheet" hidden>
    <button class="tab" data-v="stock"><span class="ic">▤</span>Stock</button>
    <button class="tab" data-v="compras"><span class="ic">⇩</span>Compras e ingresos</button>
    <button class="tab" data-v="novedades"><span class="ic">✎</span>Novedades</button>
    <button class="tab" data-v="precios"><span class="ic">%</span>Precios</button>
    <button class="tab" data-v="dist"><span class="ic">⇄</span>Distribuidores</button>
  </div>
  <div class="sb-foot" id="sb-foot"></div>
</nav>
<div class="toast" id="toast"></div>
<div id="print-area"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>

<script src="js/base.js?v=89"></script>

<script src="js/novedades.js?v=89"></script>
<script src="js/reparto.js?v=89"></script>
<script src="js/stock.js?v=89"></script>
<script src="js/distribuidores.js?v=89"></script>
<script src="js/usuarios.js?v=89"></script>

<script src="js/app.js?v=89"></script>
</body>
</html>
